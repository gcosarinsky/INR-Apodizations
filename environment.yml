name: inr-apodizations
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - typer
  - loguru
  - tqdm
  - ruff
  - cudatoolkit=11.8
  - cudnn=8.9
  - numpy=1.26
  - ipython
  - ipykernel
  - matplotlib
  - scipy
  - pymust
  - pip:
    - tensorflow==2.10
    - cupy-cuda11x
    - python-dotenv
    - -e .