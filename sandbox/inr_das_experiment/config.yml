io:
  dataset_folder: data/delayed_samples_dataset/20260325_103815
  processed_root: sandbox/inr_das_experiment/outputs/processed
  sandbox_output_root: sandbox/inr_das_experiment/outputs

model:
  hidden_units: 8
  n_hidden_layers: 3
  activation: relu
  output_activation: sigmoid
  scaled_features: true
  feature_chunk_size: 262144

training:
  batch_size: 4
  epochs: 50
  learning_rate: 0.01
  loss: mae_db
  metric: mae_db
  mae_db_ref: [1, 1]
  mae_db_eps: 1.0e-8
  train_fraction: 0.7
  seed: 42
  max_examples: null
  early_stopping_patience: 5
  reduce_lr_patience: 3

plots:
  cmap: gray
  vmin_db: -60.0
  vmax_db: 0.0
  x_values_apod: [0.0, -10.0, 10.0]
  z_profiles_mm: [15.0, 25.0, 35.0]
  apod_cmap: viridis