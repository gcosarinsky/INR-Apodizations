io:
  dataset_folder: data/delayed_samples_dataset/20260326_102630
  processed_root: sandbox/inr_das_experiment/outputs/processed
  sandbox_output_root: sandbox/inr_das_experiment/outputs

model:
  hidden_units: 8
  n_hidden_layers: 3
  activation: relu
  output_activation: sigmoid
  scaled_features: true
  feature_chunk_size: 262144

training:
  batch_size: 4
  epochs: 50
  learning_rate: 0.01
  loss: mae
  metric: mae
  mae_db_ref: null
  mae_db_eps: 1.0e-8
  baseline_f_number: 0.75
  mask_weighting:
    enabled: true
    lambda: 3.0
    eps: 1.0e-6
    min_weight: 0.25
    max_weight: 4.0
  train_fraction: 0.7
  seed: 42
  max_examples: null
  early_stopping_patience: 5
  reduce_lr_patience: 3

plots:
  cmap: gray
  vmin_db: -60.0
  vmax_db: 0.0
  x_values_apod: [0.0, -10.0, 10.0]
  z_profiles_mm: [15.0, 25.0, 35.0]
  apod_cmap: viridis