[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "inr_apodizations"
version = "0.0.1"
description = "Apodizations for ultrasound imaging using Implicit Neural Representations (INR)"
authors = [
  { name = "gcosarinsky" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"
dependencies = [
  "rich>=13.7",
]


[tool.ruff]
line-length = 99
src = ["inr_apodizations"]
include = ["pyproject.toml", "inr_apodizations/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["inr_apodizations"]
force-sort-within-sections = true

