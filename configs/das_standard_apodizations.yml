delayed_samples_dataset: "20260326_102630"   # name of the delayed samples dataset to use as input
example_idx: 0                               # single example to process (legacy, used if interactive_mode=false)
methods: [boxcar, hanning]
f_number: 1.0
wave_source_mode: 0
scaled: false

# Interactive mode: navigate through multiple examples with keyboard controls
# When true, ignores example_idx and processes all available examples or a specified subset
interactive_mode: true
example_indices: null  # null = all examples; or list [0, 1, 5, 10] for subset

# Apodization plotting slices
x_fixed: 0.0
z_fixed: 20.0

# DAS display range (dB)
vmin_db: -60.0
vmax_db: 0.0
normalize_per_image: true

# Optional lateral reflector profile plot
reflector_lateral_profile:
  enabled: true
  line_length_mm: 5.0
  scatterer_selection: strongest
  scatterer_idx: 0
  overlay_profiles: true
  use_db: true
  vmin_db: -60.0
  include_target: true
  images: [uniform, boxcar, hanning, target]

# Output controls
save: true
show: true
save_npy: false
output_dir: sandbox/figures

# Scatterer evaluation (requires scatterers from RF dataset)
scatterer_eval:
  enabled: true
  radius_mm: 0.5
  hist_bins: 50

# Optional runtime controls
use_mmap: true
dpi: 150 
cmap: gray
