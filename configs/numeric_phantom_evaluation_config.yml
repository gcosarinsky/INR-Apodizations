io:
  simulation_output_root: scripts/outputs/evaluation/numeric_phantom/delayed_samples
  evaluation_output_root: scripts/outputs/evaluation/numeric_phantom/
  save_plot: true
  model_path: scripts/outputs/train/20260505_165143

model_comparison:
  model_1_path: scripts/outputs/train/20260423_113629
  model_2_path: scripts/outputs/train/20260505_165143
  model_1_label: inr_model_1
  model_2_label: inr_model_2
  feature_chunk_size: 65536

phantom:
  mode: grid
  unit_amplitude: true
  seed: 42
  grid:
    x_count: 5
    z_count: 6
    x_center_mm: 10.0
    z_start_mm: 5.0
    x_spacing_mm: 5.0
    z_spacing_mm: 5.0
    amplitude_range: [0.4, 1.0]
  list:
    points_mm: []

simulation:
  fs: 20.832
  fc: 5.208
  pitch: 0.3
  element_width: 0.27
  element_height: 5.0
  n_elements: 128
  bandwidth: 67
  c1: 1.54
  angles: [-5, 6, 1]
  t_start: 0.0
  roi_simulation: [-4, 22.0, 1.0, 32]
  n_samples: null

beamforming:
  f1: 1.0
  f2: 10.0
  taps: 62
  f_number: 0.5
  x_step: 0.1
  z_step: 0.1
  roi_user: [-2, 22.0, 1.0, 32.0]
  blocksize_img: [32, 8]
  n_batch: 0
  n_ch: 128

visualization:
  enabled: true
  dyn_range_db: 60

reflector_lateral_profiles:
  enabled: true
  # Set inr_enabled to false to skip INR model loading and evaluate only reference apodizations.
  inr_enabled: true
  methods: [uniform, boxcar, hanning, inr]
  reflector_indices: all
  half_width_lateral_mm: 1.5
  half_width_axial_mm: 1.0
  line_length_margin_mm: 1.0
  thickness_mm: 0.5
  vmin_db: -60.0
  save_individual_rows: false
  # Profile display mode for per-reflector figures: "lateral", "axial", or "both".
  profile_type: lateral
  snr_radius_mm: 1.5
  # Optional SNR summary y-axis limits in dB. Use null for automatic limits.
  snr_y_lim_db: [50, 60]  # Example: [0.0, 60.0]

plots:
  legend_fontsize: 10      # Tamaño de fuente para legendas (default: 8)
  title_fontsize: 12      # Tamaño de fuente para títulos (default: 10)
  axis_fontsize: 12       # Tamaño de fuente para etiquetas de ejes (default: 10)

training_target:
  # When enabled, computes the training target (Gaussian-modulated uniform DAS) and
  # shows it as the last panel in the 2x2 comparison plot.
  # If the total number of images exceeds 4, 'boxcar' is dropped to preserve the 2x2 layout.
  enabled: false
  sigma_x_mm: 0.2          # Lateral Gaussian std dev for the mask (mm)
  sigma_z_mm: 0.2          # Axial Gaussian std dev for the mask (mm)
  alpha: 0.0               # Relaxation factor in [0, 1): 0 = pure mask, >0 adds constant background
  include_in_profiles: true  # Also include target in reflector profile / FWHM / SNR analysis
  display_label: target    # Key used in plots, CSV headers, and profile legends