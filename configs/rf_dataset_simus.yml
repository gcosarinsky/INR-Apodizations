# Configuration for RF dataset generation (MUST simulations)
# These parameters define the probe, acquisition, and dataset settings.
# Saved alongside each RF dataset.
# IMPORTANT: pymust uses meters, Hz, seconds as units, so all parameters are converted to these units in the code.
# Some values come from PICMUS dataset

# probe parameters
pitch: 0.3            # mm
element_width: 0.27   # mm
element_height: 5     # mm
n_elements: 128
fc: 5.208             # MHz - center frequency
bandwidth: 67         # % bandwidth

# plane wave acquisition parameters
fs: 20.832            # MHz - sampling frequency
n_pulses: 2.5
angles: [-5, 6, 1]    # [start, stop, step] in degrees (np.arange)
t_start: 0           # us - start time offset (negative to include earlier echoes)

c1: 1.54              # mm/us - speed of sound

dataset_generation:
  n_examples: 64          # total number of examples to simulate
  n_scat: 100             # number of scatterers per example
  roi_simulation: [-22, 22, 1, 42]  # [xmin, xmax, zmin, zmax] in mm

# Noise generation options (optional). If enabled, `noise.npy` is created
# with the same shape as `rf.npy`. `snr_db` is interpreted as target
# signal-to-noise ratio (dB) computed per-example using RMS power.
noise:
  enable: true
  snr_db: 12
  seed: 42
  dtype: int16  # data type for noise samples, typically int16 for RF data
