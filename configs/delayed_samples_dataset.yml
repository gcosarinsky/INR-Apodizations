# Configuration for delayed samples / beamforming computation.
# These parameters are independent of the RF dataset and can vary between runs.
# Saved alongside the delayed samples dataset.

# RF input dataset
rf_dataset_name: "20260819_123422"   # name of the RF dataset to use as input

# Bandpass filter
f1: 1       # MHz - lower cutoff
f2: 10      # MHz - upper cutoff
taps: 62    # FIR filter taps

# Beamforming parameters
f_number: 1                         # f-number for dynamic focusing?
wave_source_mode: 0                 # 0: legacy (+/-x0 by angle sign), 1: force wave_source=0

x_step: 0.1                     # mm - lateral pixel spacing
z_step: 0.1                     # mm - axial pixel spacing
roi_user: [-20, 20, 1, 40]      # [xmin, xmax, zmin, zmax] in mm

# CUDA kernel settings
blocksize_img: [32, 8]
n_batch: 0
n_ch: 128

# Dataset generation settings
target:
  sigma_x: 0.1    # target size of the point spread function in mm (lateral)
  sigma_z: 0.1    # target size of the point spread function in mm (axial)

# Noise processing options for delayed-samples generation
# If `process_noise` is true and `noise.npy` exists in the RF dataset folder,
# the script will process the noise with the same kernels and save outputs.
process_noise: false
save_combined: false
noise_operation: sum  # how to combine processed noise with signal when saving combined: sum|scale|custom
