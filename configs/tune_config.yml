io:
  dataset_folder: "data/delayed_samples_dataset/20260406_155448"
  sandbox_output_root: "sandbox/inr_das_experiment/outputs/tuning"

model:
  scaled_features: true
  feature_chunk_size:  65536
  physical_feature_set: "distance_depth_edge"
  activation: "relu"
  output_activation: "sigmoid"

training:
  seed: 42
  train_fraction: 0.8
  batch_size: 2
  epochs: 27
  early_stopping_patience: 5
  reduce_lr_patience: 5
  weight_decay: 1e-5
  # Baseline for comparison
  baseline_f_number: 0.5
  mask_weighting:
    enabled: true
    pixel_weight_lambda: 1.0

target_regeneration:
  enabled: true
  sigma_x: 0.2
  sigma_z: 0.2
  alpha: 0

tuning:
  max_trials: 1
  executions_per_trial: 1
  # Candidate architecture generation ranges
  n_layers_min: 1
  n_layers_max: 3
  n_layers_step: 1
  units_min: 4
  units_max: 32
  units_step: 4
  # Candidate architecture policy and size control
  non_increasing: true
  max_candidates: 32
  # Hyperparameters can be fixed or searched using `mode`.
  # Examples:
  # learning_rate:
  #   mode: search
  #   min: 1e-4
  #   max: 1e-2
  #   sampling: log
  # reg_tau:
  #   mode: search
  #   min: 0.5
  #   max: 0.9
  # reg_lambda:
  #   mode: search
  #   min: 1e3
  #   max: 1e6
  #   sampling: log
  # pixel_weight_lambda:
  #   mode: search
  #   min: 0.0
  #   max: 2.0

  learning_rate:
    mode: fixed
    value: 0.001
  reg_tau:
    mode: fixed
    value: 0.75
  reg_lambda: # used in case autoinit is disabled; otherwise, it's ignored and auto-initialized based on the first trial's loss.
    mode: fixed
    value: 1000
  pixel_weight_lambda:
    mode: fixed
    value: 1.0

  # Legacy keys remain supported for backward compatibility.
  # reg_tau_min: 0.5
  # reg_tau_max: 0.9
  # lr_min: 1e-3
  # lr_max: 1e-2
  weight_regularization_autoinit:
    enabled: true
    ratio: 0.2
    epsilon: 1e-12
    norm_fraction: 0.5
  # Hyperband-specific parameters (used by tune_inr_das_hyperband.py)
  hyperband_max_epochs: 40
  hyperband_factor: 3
  hyperband_iterations: 1

plots:
  cmap: "gray"
  vmin_db: -60.0
  vmax_db: 0.0

scatterer_eval:
  enabled: true
  radius_mm: 1.5
