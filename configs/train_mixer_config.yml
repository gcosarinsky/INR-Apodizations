io:
  dataset_folder: data/delayed_samples_dataset/20260406_155448
  scripts_output_root: scripts/outputs/train_mixer
  baseline_output: scripts/outputs/evaluation/baseline
  review_output_root: scripts/outputs/review

target_regeneration:
  enabled: true
  sigma_x: 0.15
  sigma_z: 0.3
  alpha: 0

model:
  # Preferred convention: explicit ordered components (2 or 3 tokens).
  # Allowed: z, x, abs_x, xrel, abs_xrel, xrel_over_z, x_over_z, z_norm, dist_to_edge
  physical_feature_components: [xrel_over_z, x_over_z, z_norm]
  # Legacy fallback (deprecated):
  # physical_feature_set: distance_depth_edge
  # hidden_units: Specifies hidden layer sizes for the MLP INR.
  #   Mode 1 (uniform): int value, requires n_hidden_layers
  #   Mode 2 (per-layer): list/tuple of layer sizes; n_hidden_layers is inferred from list length
  hidden_units: [8, 8, 8]
  n_hidden_layers: 4
  activation: relu
  output_activation: tanh
  scaled_features: true
  feature_chunk_size: 8192
  # n_apodizations: number of independent apodization channels output by the INR.
  # Each channel is a separate DAS reconstruction; outputs are combined pixel-wise
  # via a trainable linear layer inside DasInrApodMixer.
  n_apodizations: 2
  symmetry:
    # If enabled, enforce per-channel symmetry with a_sym(f) = a(f) + a(f_flip).
    # f_flip inverts signed coordinate-like features (x, xrel, x_over_z, xrel_over_z).
    enabled: true
    # Optional ordered override for feature-component names used to build f_flip.
    # If null, the script uses CoordinateManager.physical_feature_names.
    feature_components_override: null
  forced_boxcar:
    enabled: true
    # f_number: global dynamic-aperture f-number used to derive the boxcar threshold.
    f_number: 0.5
    # boxcar boundary tolerance used only for the hard threshold comparison.
    epsilon: 1.0e-8
    # q_feature_index: index of the adimensional q feature. Default assumes xrel_over_z.
    q_feature_index: 0

eval_noise:
  enabled: false
  scale: 1.0

training:
  batch_size: 1
  epochs: 15
  learning_rate: 0.001
  loss: mae
  metric: mae
  weight_decay: 0.001
  weight_regularization:
    enabled: true
    # type: regularization type applied to the apodization norm.
    # "hinge_low_norm": squared hinge penalty when global Euclidean norm < tau.
    type: hinge_low_norm
    # lambda: multiplicative factor for the regularization loss.
    # If auto_init.enabled=true, this value is overridden automatically.
    lambda: 333000
    # tau: minimum target normalized norm. Hinge activates when norm < tau.
    tau: 0.7
    epsilon: 1.0e-8
    # normalize_norm: whether to divide norm by sqrt(E*Z*X) before comparing to tau.
    normalize_norm: true
    auto_init:
      enabled: true
      # ratio: target weight_reg_loss ≈ ratio * mae_initial (at a tau_reference norm).
      ratio: 0.2
      # norm_fraction: reference norm = norm_fraction * tau (hypothetical violation point).
      norm_fraction: 0.8
      epsilon: 1.0e-12
  lateral_regularization:
    enabled: true
    # lambda: multiplicative factor for the lateral regularization loss.
    # If auto_init.enabled=true, this value is overridden automatically.
    lambda: 0.0
    # q = (abs(x_rel) / z)^q_power — penalizes apodization energy at large lateral angles.
    # Use q_power=1.0 for linear (default), q_power=2.0 for quadratic emphasis.
    q_power: 1.0
    # q_epsilon: numerical epsilon to avoid division by zero when computing q.
    q_epsilon: 1.0e-8
    # abs_xrel_feature_index / z_feature_index: indices into physical_feature_components.
    # Default assumes [xrel, z, x] order → 0=xrel (abs value used), 1=z.
    abs_xrel_feature_index: 0
    z_feature_index: 1
    # normalize_by_uniform: normalize raw penalty by its uniform-apodization reference.
    # Recommended true: makes lambda scale-independent w.r.t. the spatial grid.
    normalize_by_uniform: true
    # channel_reduction: aggregation across apodization channels (mixer only).
    # "mean": average over N channels; "sum": sum over N channels.
    channel_reduction: mean
    auto_init:
      enabled: true
      # ratio: target lateral_reg_loss ≈ ratio * mae_initial (at initial model weights).
      ratio: 0.2
      # epsilon: safety floor for division during lambda estimation.
      epsilon: 1.0e-12
  mae_db_ref: null
  mae_db_eps: 1.0e-8
  baseline_f_number: 0.5
  mask_weighting:
    enabled: true
    pixel_weight_lambda: 1.5
  train_fraction: 0.8
  seed: 42
  max_examples: null
  early_stopping_patience: 4
  reduce_lr_patience: 3

resume:
  enabled: false
  # Preferred source: previous run directory with model.keras + history artifacts.
  source_run_dir: scripts\outputs\train_mixer\20260519_115528
  # Optional fallback when only a model file is available.
  source_model_path: ""
  # Reserved for future optimizer-state persistence. Currently weights-only resume.
  restore_optimizer: true
  # additional: train N extra epochs from previous history length.
  # target_total: use training.epochs as total global epoch target.
  epochs_mode: additional
  additional_epochs: 5
  strict_compatibility: true

plots:
  cmap: gray
  vmin_db: -60.0
  vmax_db: 0.0
  normalize_each_image: true
  x_values_apod: [0.0, -10.0, 10.0]
  z_profiles_mm: [15.0, 25.0, 35.0]
  apod_cmap: viridis
  apod_vmin: -1.0
  apod_vmax: 1.0

scatterer_eval:
  enabled: true
  radius_mm: 1.25
  hist_bins: 50

reflector_profile_comparison:
  enabled: true
  scatterer_selection: strongest
  scatterer_idx: [0, 6, 12]

results_review:
  run_timestamp: ""
