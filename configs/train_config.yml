io:
  dataset_folder: data/delayed_samples_dataset/20260327_141700
  processed_root: sandbox/inr_das_experiment/outputs/processed
  sandbox_output_root: sandbox/inr_das_experiment/outputs
  review_output_root: sandbox/inr_das_experiment/review_outputs

target_regeneration:
  enabled: true
  sigma_x: 0.2
  sigma_z: 0.2

model:
  hidden_units: 8
  n_hidden_layers: 3
  activation: relu
  output_activation: sigmoid
  scaled_features: true
  feature_chunk_size: 262144

training:
  batch_size: 4
  epochs: 20
  learning_rate: 0.01
  loss: mae
  metric: mae
  weight_regularization:
    enabled: true
    type: hinge_low_norm
    lambda: 20000
    tau: 0.50
    epsilon: 1.0e-8
    normalize_norm: true
  mae_db_ref: null
  mae_db_eps: 1.0e-8
  baseline_f_number: 0.75
  mask_weighting:
    enabled: true
    lambda: 0.5
  train_fraction: 0.7
  seed: 42
  max_examples: null
  early_stopping_patience: 5
  reduce_lr_patience: 3

plots:
  cmap: gray
  vmin_db: -60.0
  vmax_db: 0.0
  normalize_each_image: true
  x_values_apod: [0.0, -10.0, 10.0]
  z_profiles_mm: [15.0, 25.0, 35.0]
  apod_cmap: viridis

scatterer_eval:
  enabled: true
  radius_mm: 0.75
  hist_bins: 50

results_review:
  run_timestamp: "20260330_154310"  # Folder under sandbox_output_root that contains model.keras + train_config_info.yml
  max_validation_examples: null
