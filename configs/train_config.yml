io:
  dataset_folder: data/delayed_samples_dataset/20260406_155448
  scripts_output_root: scripts/outputs/train
  baseline_output: scripts/outputs/evaluation/baseline
  review_output_root: scripts/outputs/review
  # dataset_noise removed: noise must be provided as precomputed files in the dataset folder

target_regeneration:
  enabled: true
  sigma_x: 0.2
  sigma_z: 0.2
  alpha: 0

model:
  # Preferred convention: explicit ordered components (2 or 3 tokens).
  # Allowed: z, x, abs_x, xrel, abs_xrel, dist_to_edge
  physical_feature_components: [abs_xrel, z, abs_x]
  # Legacy fallback (deprecated):
  # physical_feature_set: distance_depth_edge
  # hidden_units: Specifies hidden layer sizes for the MLP INR.
  #   Mode 1 (uniform): int value, requires n_hidden_layers
  #   Mode 2 (per-layer): list/tuple of layer sizes; n_hidden_layers is inferred from list length
  hidden_units: [32, 16, 8, 4]
  n_hidden_layers: 4
  # Example Mode 2 (per-layer hidden sizes):
  # hidden_units: [8, 16, 8]
  # n_hidden_layers: 3  # Will be ignored; inferred as 3 from list length
  activation: relu
  output_activation: sigmoid
  scaled_features: true
  feature_chunk_size: 65536
 
eval_noise:
  enabled: false
  scale: 1.0

training:
  batch_size: 1
  epochs: 5
  learning_rate: 0.001
  loss: mae
  metric: mae
  weight_decay: 0.001
  weight_regularization:
    enabled: true
    type: hinge_low_norm
    lambda: 333000
    tau: 0.7
    epsilon: 1.0e-8
    normalize_norm: true
    auto_init:
      enabled: false
      ratio: 0.2
      norm_fraction: 0.8
      epsilon: 1.0e-12
  mae_db_ref: null
  mae_db_eps: 1.0e-8
  baseline_f_number: 0.5
  mask_weighting:
    enabled: true
    pixel_weight_lambda: 1.
  train_fraction: 0.8
  seed: 42
  max_examples: null
  early_stopping_patience: 4
  reduce_lr_patience: 3

resume:
  enabled: true
  # Preferred source: previous run directory with model.keras + history artifacts.
  source_run_dir: scripts\outputs\train\20260514_140814
  # Optional fallback when only a model file is available.
  source_model_path: ""
  # Reserved for future optimizer-state persistence. Currently weights-only resume.
  restore_optimizer: true
  # additional: train N extra epochs from previous history length.
  # target_total: use training.epochs as total global epoch target.
  epochs_mode: additional
  additional_epochs: 2
  strict_compatibility: true

plots:
  cmap: gray
  vmin_db: -60.0
  vmax_db: 0.0
  normalize_each_image: true
  x_values_apod: [0.0, -10.0, 10.0]
  z_profiles_mm: [15.0, 25.0, 35.0]
  apod_cmap: viridis
  apod_vmin: -1.0
  apod_vmax: 1.0

scatterer_eval:
  enabled: true
  radius_mm: 1.25
  hist_bins: 50

reflector_profile_comparison:
  enabled: true
  scatterer_selection: strongest
  scatterer_idx: [0, 6, 12]  # Indices of scatterers to plot profiles for (if scatterer_selection is 'by_index')
  use_db: true

results_review:
  run_timestamp: ""  # Folder under scripts_output_root that contains model.keras + train_config_info.yml
  max_validation_examples: null
